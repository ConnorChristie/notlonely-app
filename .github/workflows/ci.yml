name: NotLonely CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Run SwiftFormat
        run: swiftformat .

  build_and_test:
    name: Build and Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      # Note: This assumes a project file is generated or present.
      # Since we are working with a Swift Package, the command might need adjustment
      # depending on how the project is structured for Xcode.
      # For a pure Swift package, you can use `swift build` and `swift test`.
      - name: Build
        run: |
          # The following command is a placeholder.
          # A real xcodeproj would be needed to use xcodebuild.
          # xcodebuild build -scheme NotLonely -sdk iphonesimulator
          swift build
          
      - name: Test
        run: |
          # The following command is a placeholder.
          # xcodebuild test -scheme NotLonely -sdk iphonesimulator
          swift test

